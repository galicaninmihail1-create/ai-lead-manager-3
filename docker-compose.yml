services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_lead_manager}
      POSTGRES_USER: ${POSTGRES_USER:-ai_lead_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ai_lead_manager:local_dev_password@postgres:5432/ai_lead_manager}
      AI_EXECUTION_MODE: ${AI_EXECUTION_MODE:-MOCK}
      ALLOW_LIVE_AI: ${ALLOW_LIVE_AI:-false}
      AI_KILL_SWITCH: ${AI_KILL_SWITCH:-false}
      AI_DEFAULT_QUALIFICATION_PROVIDER: ${AI_DEFAULT_QUALIFICATION_PROVIDER:-mock}
      AI_DEFAULT_QUALIFICATION_MODEL: ${AI_DEFAULT_QUALIFICATION_MODEL:-deterministic-keyword-v1}
      AI_DEFAULT_DRAFT_PROVIDER: ${AI_DEFAULT_DRAFT_PROVIDER:-mock}
      AI_DEFAULT_DRAFT_MODEL: ${AI_DEFAULT_DRAFT_MODEL:-deterministic-template-v1}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-3}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-15}
      AI_TOTAL_TIMEOUT_SECONDS: ${AI_TOTAL_TIMEOUT_SECONDS:-20}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-2}
      AI_MAX_MESSAGES: ${AI_MAX_MESSAGES:-20}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-20000}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-8000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1000}
      AI_OPENAI_COMPATIBLE_PROVIDERS_JSON: "${AI_OPENAI_COMPATIBLE_PROVIDERS_JSON:-[]}"
      AI_MODEL_PRICING_JSON: "${AI_MODEL_PRICING_JSON:-[]}"
      TENANT_API_KEY_PEPPER: "${TENANT_API_KEY_PEPPER:-}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
